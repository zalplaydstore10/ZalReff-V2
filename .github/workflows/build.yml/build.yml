name: Build ZalReff V2

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source
        run: unzip -o ZalReff-V2-Source.zip

      - name: Build JAR
        run: mvn -B -f ZalReff-V2/pom.xml clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZalReff-V2-JAR
          path: ZalReff-V2/target/ZalReff-V2.jar
          if-no-files-found: error

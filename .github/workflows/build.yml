name: Build ZalReff V2

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          unzip -oq ZalReff-v2.0.0-Source.zip -d source
          POM=$(find source -name pom.xml -print -quit)
          if [ -z "$POM" ]; then
            echo "ERROR: pom.xml tidak ditemukan!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$POM")" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress -f "$PROJECT_DIR/pom.xml" clean package

      - name: Verify JAR
        run: |
          test -f "$PROJECT_DIR/target/ZalReff-V2.jar"
          jar tf "$PROJECT_DIR/target/ZalReff-V2.jar" | grep -qx plugin.yml

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZalReff-V2-JAR
          path: ${{ env.PROJECT_DIR }}/target/ZalReff-V2.jar
          if-no-files-found: error
